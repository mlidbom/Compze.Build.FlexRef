name: Publish to NuGet

on:
  push:
    tags: ['v*']

jobs:
  build-and-test:
    uses: ./.github/workflows/build-and-test.yml

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # lets the nuget.org Trusted Publishing step request the GitHub OIDC token that nuget.org exchanges for a short-lived API key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Determine version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.version.outputs.version }}
          validation_level: error

      - name: Pack
        run: |
          dotnet pack \
            src/Compze.Build.FlexRef/Compze.Build.FlexRef.csproj \
            --configuration Release \
            --output ./artifacts

      # nuget.org Trusted Publishing: a policy on nuget.org (owner MagnusLidbom) trusts repository
      # mlidbom/Compze.Build.FlexRef, workflow file publish.yml. Renaming this file or the repository stops
      # publishing until that policy is updated. The key expires after one hour, so this step stays
      # immediately before the push rather than before the build and test run.
      - name: Get short-lived nuget.org API key (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: MagnusLidbom

      - name: Push to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: Create GitHub Release
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.changes }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$RELEASE_NOTES" > RELEASE_NOTES.md
          gh release create "$GITHUB_REF_NAME" ./artifacts/*.nupkg \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file RELEASE_NOTES.md

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
